<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>RSS 订阅源</title>
	<style>
		:root {
			--bg: #0f1117;
			--bg-card: #1a1d28;
			--bg-input: #252836;
			--bg-hover: #2a2e3f;
			--text: #e4e6eb;
			--text-muted: #8b8fa3;
			--accent: #6366f1;
			--border: #2d3142;
			--radius: 10px;
		}
		[data-theme="light"] {
			--bg: #f5f6fa;
			--bg-card: #ffffff;
			--bg-input: #f0f1f5;
			--bg-hover: #e8eaf0;
			--text: #1a1d28;
			--text-muted: #6b7280;
			--accent: #2563eb;
			--border: #e2e5ec;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;
			background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
		}
		.container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
		header {
			background: var(--bg-card); border-bottom: 1px solid var(--border);
			padding: 16px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
		}
		.header-content { display: flex; align-items: center; justify-content: space-between; }
		.logo { display: flex; align-items: center; gap: 10px; }
		.logo-icon {
			width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #8b5cf6);
			border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 20px;
		}
		.logo h1 { font-size: 18px; font-weight: 700; }
		.header-actions { display: flex; align-items: center; gap: 8px; }
		.icon-btn {
			width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
			background: var(--bg-input); color: var(--text); cursor: pointer; font-size: 15px;
			display: flex; align-items: center; justify-content: center; transition: all 0.2s;
		}
		.icon-btn:hover { background: var(--bg-hover); transform: scale(1.05); }
		.hero { text-align: center; padding: 36px 20px 20px; }
		.hero h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
		.hero p { font-size: 14px; color: var(--text-muted); }
		.section { padding: 8px 0 50px; }
		.list { list-style: none; }
		.list li {
			display: flex; align-items: baseline; gap: 10px; padding: 12px 4px;
			border-bottom: 1px solid var(--border); font-size: 14px;
		}
		.list li:last-child { border-bottom: none; }
		.list .icon { flex-shrink: 0; font-size: 16px; }
		.list .name { color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
		.list .name:hover { text-decoration: underline; }
		.list .url { color: var(--text-muted); font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; word-break: break-all; }
		.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
		.empty a { color: var(--accent); text-decoration: none; }
		.count { font-size: 13px; color: var(--text-muted); padding: 8px 4px 4px; }
		footer { border-top: 1px solid var(--border); padding: 20px 0; text-align: center; color: var(--text-muted); font-size: 12px; }
		footer a { color: var(--accent); text-decoration: none; }
		@media (max-width: 640px) {
			.hero h2 { font-size: 20px; }
			.list .name { max-width: 100%; }
			.list .url { max-width: 55%; }
		}
	</style>
</head>
<body>
	<header>
		<div class="container">
			<div class="header-content">
				<div class="logo">
					<div class="logo-icon">📡</div>
					<h1>RSS 订阅源</h1>
				</div>
				<div class="header-actions">
					<button class="icon-btn" onclick="toggleTheme()" title="切换主题" id="theme-btn">🌙</button>
				</div>
			</div>
		</div>
	</header>

	<div class="hero">
		<div class="container">
			<h2>RSS 订阅源</h2>
			<p>共 {{SUB_COUNT}} 个订阅源，复制对应地址到 RSS 阅读器订阅，或在浏览器打开预览</p>
		</div>
	</div>

	<div class="section">
		<div class="container">
			<div class="count" id="count">共 {{SUB_COUNT}} 个订阅源</div>
			{{SUBSCRIPTIONS}}
		</div>
	</div>

	<footer>
		<div class="container">
			<p>RSSWorker · Powered by <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a></p>
		</div>
	</footer>

	<script>
		function toggleTheme() {
			const cur = document.documentElement.getAttribute('data-theme') || 'dark';
			const next = cur === 'light' ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', next);
			localStorage.setItem('rss-theme', next);
			document.getElementById('theme-btn').textContent = next === 'light' ? '☀️' : '🌙';
		}
		(function(){ const t = localStorage.getItem('rss-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); document.getElementById('theme-btn').textContent = t === 'light' ? '☀️' : '🌙'; })();
	</script>
</body>
</html>
